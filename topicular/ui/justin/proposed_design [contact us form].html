<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Feedback Form</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --accent: #2563eb;
      --muted: #6b7280;
    }

    * {
      box-sizing: border-box;
      transition: 0.3s ease-out;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: var(--bg);
      color: #111827;
      padding: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .card {
      background: var(--card);
      padding: 20px;
      border-radius: 12px;
      width: 100%;
      max-width: 680px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    }

    h1 {
      margin: 0 0 12px 0;
      font-size: 1.25rem;
    }

    form > .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="email"],
    input[type="number"],
    input[type="date"],
    select,
    textarea {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #e6e9ef;
      font-size: 0.95rem;
      outline: none;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .full {
      grid-column: 1 / -1;
    }

    fieldset {
      border: none;
      padding: 0;
      margin: 0 0 12px 0;
    }

    .choices {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .small {
      font-size: 0.9rem;
      color: var(--muted);
    }

    .actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 8px;
    }

    button {
      padding: 10px 14px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      background: var(--accent);
      color: white;
      font-weight: 600;
    }

    button.secondary {
      background: transparent;
      color: var(--muted);
      border: 1px solid #e6e9ef;
    }

    @media (max-width: 560px) {
      form > .row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <h1>Quick Feedback</h1>

    <form id="feedbackForm" action="#" method="post" novalidate>
      <div class="row">
        <div>
          <label for="fullname">Full name</label>
          <input id="fullname" name="fullname" type="text" placeholder="Jane Doe" required />
        </div>

        <div>
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" required />
        </div>

        <div>
          <label for="date">Date</label>
          <input id="date" name="date" type="date" required />
        </div>

        <div>
          <label for="rating">Rating</label>
          <select id="rating" name="rating" required>
            <option value="">— pick —</option>
            <option value="5">5 — Excellent</option>
            <option value="4">4 — Good</option>
            <option value="3">3 — Okay</option>
            <option value="2">2 — Poor</option>
            <option value="1">1 — Terrible</option>
          </select>
        </div>

        <div class="full">
          <label for="comments">Comments</label>
          <textarea id="comments" name="comments" placeholder="Tell us what we did well or how to improve..." required></textarea>
        </div>

        <div>
          <label>Recommend to a friend?</label>
          <fieldset class="choices" aria-label="recommend">
            <label><input type="radio" name="recommend" value="yes" required /> Yes</label>
            <label><input type="radio" name="recommend" value="maybe" /> Maybe</label>
            <label><input type="radio" name="recommend" value="no" /> No</label>
          </fieldset>
        </div>

        <div>
          <label>Subscribe</label>
          <div class="choices">
            <label class="small"><input type="checkbox" name="subscribe" value="newsletter" /> Newsletter</label>
            <label class="small"><input type="checkbox" name="subscribe" value="offers" /> Special offers</label>
          </div>
        </div>

        <div>
          <label for="visits">Times used this month</label>
          <input id="visits" name="visits" type="number" min="0" max="999" placeholder="0" />
        </div>

        <div>
          <label for="subject">Subject (short)</label>
          <input id="subject" name="subject" type="text" maxlength="80" placeholder="Bug report, feature request..." />
        </div>
      </div>

      <div class="actions">
        <button type="submit">Send feedback</button>
        <button type="reset" class="secondary">Reset</button>
      </div>
    </form>
  </main>

  <!-- small client-side handler; name it app.js if you prefer a separate file -->
  <script>
    (function () {
      const form = document.getElementById('feedbackForm');

      form.addEventListener('submit', function (e) {
        e.preventDefault();

        if (!form.checkValidity()) {
          // let browser show invalid fields
          form.reportValidity();
          return;
        }

        // build a compact payload to send / inspect
        const data = new FormData(form);
        const payload = Object.fromEntries(data.entries());

        // collect checkbox multi-values (if any)
        const subs = [];
        form.querySelectorAll('input[type="checkbox"]:checked').forEach(cb => subs.push(cb.value));
        if (subs.length) payload.subscribe = subs;

        // radio fallback: ensure recommend is present
        if (!payload.recommend) payload.recommend = null;

        // demo: print to console — replace with fetch() to submit to server
        console.log('Feedback payload:', payload);

        // simple UX
        alert('Thanks — feedback received.');
        form.reset();
      }, false);
    }());
  </script>
</body>
</html>
