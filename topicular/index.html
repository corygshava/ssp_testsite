<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Data Dashboard</title>
    
    <!-- Bootstrap 4 CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    
    <!-- Custom Modern CSS -->
    <style>
        :root {
            --primary-color: #6366f1;
            --secondary-color: #8b5cf6;
            --accent-color: #ec4899;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --border-color: #e5e7eb;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
        }

        /* Sidebar Styles */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: 280px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            padding: 2rem 0;
            overflow-y: auto;
            transition: transform 0.3s ease;
            z-index: 1000;
            box-shadow: var(--shadow-lg);
        }

        .sidebar.collapsed {
            transform: translateX(-100%);
        }

        .sidebar-header {
            padding: 0 1.5rem 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 1.5rem;
        }

        .sidebar-title {
            color: white;
            font-size: 1.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-item {
            padding: 0.75rem 1.5rem;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            display: block;
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .nav-item:hover {
            color: white;
            background-color: rgba(255, 255, 255, 0.1);
            border-left-color: var(--accent-color);
            transform: translateX(5px);
        }

        .nav-item.active {
            color: white;
            background-color: rgba(255, 255, 255, 0.15);
            border-left-color: white;
        }

        /* Main Content */
        .main-content {
            margin-left: 280px;
            padding: 2rem;
            transition: margin-left 0.3s ease;
            min-height: 100vh;
        }

        .main-content.expanded {
            margin-left: 0;
        }

        /* Toggle Button */
        .sidebar-toggle {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            z-index: 1001;
            background: var(--primary-color);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
        }
        .sidebar-toggle:hover {
            transform: scale(1.1);
            box-shadow: var(--shadow-lg);
        }
        .sidebar-toggle svg {
            width: 24px;
            height: 24px;
            fill: white;
        }

        /* Cards */
        .topic-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            opacity: 0;
            transform: translateY(20px);
        }
        .topic-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
        }
        .topic-card.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .topic-header {
            display: flex;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--border-color);
        }
        .topic-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 1rem;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
        }
        .topic-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-primary);
            margin: 0;
        }

        .objectives-section {
            margin-bottom: 1.5rem;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .objective-item {
            background: var(--bg-color);
            padding: 0.75rem 1rem;
            margin-bottom: 0.5rem;
            border-radius: 8px;
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
        }
        .objective-item:hover {
            background: #e0e7ff;
            transform: translateX(5px);
        }
        .objective-item::before {
            content: "→";
            color: var(--primary-color);
            margin-right: 0.75rem;
            font-weight: bold;
        }

        .subtopic-tag {
            display: inline-block;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 0.5rem 1rem;
            margin: 0.25rem;
            border-radius: 20px;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .subtopic-tag:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 8px rgba(99, 102, 241, 0.3);
        }

        /* Loading Animation */
        .loading {
            text-align: center;
            padding: 3rem;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--border-color);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
            }
            .main-content {
                margin-left: 0;
                padding: 1rem;
            }
            .topic-card {
                padding: 1.5rem;
            }
        }

        /* Scrollbar Styling */
        .sidebar::-webkit-scrollbar {
            width: 6px;
        }
        .sidebar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
        }
        .sidebar::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>
    <!-- Toggle Button -->
    <button class="sidebar-toggle" id="sidebarToggle">
        <svg viewBox="0 0 24 24">
            <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
        </svg>
    </button>

    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2 class="sidebar-title">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="white">
                    <path d="M12 2L2 7v10c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-10-5z"/>
                </svg>
                Topics
            </h2>
        </div>
        <div id="navItems"></div>
    </nav>

    <!-- Main Content -->
    <main class="main-content" id="mainContent">
        <div id="contentArea">
            <div class="loading">
                <div class="loading-spinner"></div>
                <p>Loading data...</p>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    
    <script src="ui/js/SuperScript.js"></script>
    <script src="ui/js/toappend.js"></script>
    <script src="ui/js/customalerter.js"></script>

    <script>
        // Sample data (replace with actual API call)
        const sampleData = [];
        let currentData = [];

        const fetch_bypass = "api_fetcher";


        curfun = fetch_bypass;
        if(window[curfun] == undefined){
            window[curfun] = async (p,dta = {},mt = 'POST') => {
                try{
                    alert_silent({to: p,data: dta,method: mt});
                    dta[fetch_identifier] = 'yes';
                    // alert_dark(JSON.stringify(dta));

                    let headers = {
                        'X-Requested-With' : 'XMLHttpRequest',
                        'Accept' : 'application/json',
                        'Content-Type' : 'application/json',
                    };
                    let body = mt == "GET" || mt == 'HEAD' ? null : JSON.stringify(dta);

                    // alert_info(JSON.stringify(headers));
                    // console.log(`${fetch_bypass}: `,dta);

                    let req = await fetch(p,{
                        method: mt.toUpperCase(),
                        headers: headers,
                        // credentials: 'same-origin',
                        body: body,
                    });

                    if(!req.ok){
                        throw new Error(`[${req.status}] -> ${req.statusText}`);
                    }

                    return await req.json();
                } catch (error){
                    alert_danger(error);
                    throw error;
                }
            }
        }

        // Initialize the application
        async function init() {
            try {
                // Simulate API call
                const response = await fetch('./getdata');
                currentData = await response.json();
                currentData = sampleData; // Using sample data for demo

                alert('done');

                return true;
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('contentArea').innerHTML = 
                    '<div class="alert alert-danger">Error loading data. Please try again.</div>';

                return false;
            }
        }

        // Render navigation items
        function renderNavigation() {
            const navItems = document.getElementById('navItems');
            navItems.innerHTML = currentData.map((item, index) => `
                <a href="#topic-${index}" class="nav-item" data-topic="${index}">
                    ${item.topic}
                </a>
            `).join('');
        }

        // Render main content
        function renderContent() {
            const contentArea = document.getElementById('contentArea');
            contentArea.innerHTML = currentData.map((item, index) => `
                <div class="topic-card" id="topic-${index}">
                    <div class="topic-header">
                        <div class="topic-icon">${item.topic.charAt(0)}</div>
                        <h2 class="topic-title">${item.topic}</h2>
                    </div>
                    
                    ${item.objectives.length > 0 ? `
                        <div class="objectives-section">
                            <h3 class="section-title">Learning Objectives</h3>
                            ${item.objectives.map(obj => `
                                <div class="objective-item">${obj}</div>
                            `).join('')}
                        </div>
                    ` : ''}
                    
                    <div class="subtopics-section">
                        <h3 class="section-title">Subtopics</h3>
                        ${item.subtopics.map(sub => `
                            <span class="subtopic-tag">${sub}</span>
                        `).join('')}
                    </div>
                </div>
            `).join('');

            // Animate cards on scroll
            animateCards();
        }

        // Animate cards with Anime.js
        function animateCards() {
            const cards = document.querySelectorAll('.topic-card');
            
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                        anime({
                            targets: entry.target,
                            opacity: [0, 1],
                            translateY: [20, 0],
                            duration: 800,
                            easing: 'easeOutExpo'
                        });
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.1 });

            cards.forEach(card => observer.observe(card));
        }

        // Setup event listeners
        function setupEventListeners() {
            // Sidebar toggle
            const sidebarToggle = document.getElementById('sidebarToggle');
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('mainContent');

            sidebarToggle.addEventListener('click', () => {
                sidebar.classList.toggle('collapsed');
                mainContent.classList.toggle('expanded');
                
                anime({
                    targets: sidebarToggle,
                    rotate: sidebar.classList.contains('collapsed') ? '180deg' : '0deg',
                    duration: 300,
                    easing: 'easeInOutQuad'
                });
            });

            // Navigation links
            document.querySelectorAll('.nav-item').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    
                    // Update active state
                    document.querySelectorAll('.nav-item').forEach(item => 
                        item.classList.remove('active'));
                    link.classList.add('active');
                    
                    // Smooth scroll to section
                    const targetId = link.getAttribute('href');
                    const targetElement = document.querySelector(targetId);
                    
                    if (targetElement) {
                        targetElement.scrollIntoView({ 
                            behavior: 'smooth',
                            block: 'start'
                        });
                        
                        // Add highlight animation
                        anime({
                            targets: targetElement,
                            backgroundColor: ['#ffffff', '#f0f9ff', '#ffffff'],
                            duration: 1500,
                            easing: 'easeInOutQuad'
                        });
                    }
                    
                    // Close sidebar on mobile
                    if (window.innerWidth <= 768) {
                        sidebar.classList.add('collapsed');
                        mainContent.classList.add('expanded');
                    }
                });
            });

            // Subtopic tag click animation
            document.addEventListener('click', (e) => {
                if (e.target.classList.contains('subtopic-tag')) {
                    anime({
                        targets: e.target,
                        scale: [1, 1.1, 1],
                        duration: 300,
                        easing: 'easeInOutQuad'
                    });
                }
            });
        }

        // Initialize on page load
        window.addEventListener('load', () => {
            init().then(e => {
                renderNavigation();
                renderContent();
                setupEventListeners();
            })
        });
    </script>
</body>
</html>
